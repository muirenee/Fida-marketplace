services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fida_marketplace
      POSTGRES_USER: fida
      POSTGRES_PASSWORD: fida
    ports:
      - "5432:5432"
    volumes:
      - fida_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fida -d fida_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - fida_redis:/data

volumes:
  fida_postgres:
  fida_redis:
