services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fida_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - fida_redis:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN}
      TRUST_PROXY: ${TRUST_PROXY:-}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
      FEATURED_STORE_IDS: ${FEATURED_STORE_IDS:-}
      MEDIA_DIRECTORY: /data/media
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_SECRET: ${FLUTTERWAVE_WEBHOOK_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://marketplaceadmin.fidalix.com}
    volumes:
      - fida_media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:3001:3001"

  admin:
    build:
      context: ..
      dockerfile: apps/admin-web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FIDA_API_BASE_URL: http://api:3001
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://marketplaceadmin.fidalix.com}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:3000:3000"

volumes:
  fida_media:
  fida_postgres:
  fida_redis:
