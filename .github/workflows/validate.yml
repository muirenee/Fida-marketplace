name: Validate

on:
  push:
    branches: [main, develop, feature/marketplace-business-delivery]
  pull_request:

jobs:
  ios-cloud-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check native permissions and Firebase isolation
        run: python3 tests/ios-configuration.py
      - name: Validate pinned EAS profiles, workflows and native target parsing
        run: npm exec --yes --package eas-cli@24.8.0 -- sh -c 'node tests/eas-configuration.cjs "$(command -v eas)"'
      - name: Verify cloud-only shell scripts
        run: bash -n scripts/build-ios-cloud.sh scripts/eas/prepare-ios.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Validate dependencies against the pinned EAS Flutter SDK
        run: |
          for app in customer merchant driver; do
            (cd "apps/$app-mobile" && flutter pub get && flutter analyze --no-fatal-infos --no-fatal-warnings)
          done
  api-and-schema:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: fida_marketplace
      POSTGRES_USER: fida_ci
      POSTGRES_PASSWORD: fida-ci-password
      DATABASE_URL: postgresql://fida_ci:fida-ci-password@postgres:5432/fida_marketplace?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_DAYS: 30
      CORS_ORIGIN: http://localhost:3000
      APP_ENV: test
      API_BIND_ADDRESS: 127.0.0.1
      ADMIN_BIND_ADDRESS: 127.0.0.1
      FIDA_API_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate --config prisma.config.ts

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck API
        run: pnpm typecheck:api

      - name: Integration tests
        run: pnpm test:integration

      - name: Verify environment update script
        run: python3 tests/environment-update.py

      - name: Typecheck Admin web
        run: pnpm --filter @fida/admin-web typecheck

      - name: Build Admin web
        run: pnpm --filter @fida/admin-web build

      - name: Validate Docker Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Verify architecture files
        run: |
          test -f docs/ARCHITECTURE.md
          test -f docs/DEPLOYMENT.md
          test -f infra/docker-compose.yml
          test -f apps/api/Dockerfile
          test -f apps/admin-web/Dockerfile
          test -f apps/admin-web/app/page.tsx
          test -f apps/customer-mobile/lib/main.dart
          test -f apps/merchant-mobile/lib/main.dart
          test -f apps/driver-mobile/lib/main.dart
